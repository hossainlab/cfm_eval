[project]
name = "cfm-eval"
version = "0.1.0"
description = "Zero-shot evaluation of single-cell foundation models on tumour scRNA-seq"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "anndata",
    "scanpy",
    "scikit-learn",
    "leidenalg",
    "python-igraph",
    "harmonypy",
]

[project.optional-dependencies]
scvi = ["scvi-tools"]
cnv = ["infercnvpy"]
# scGPT and Geneformer pin old torch/transformer stacks; install them in a separate
# environment (or Colab/Kaggle) and only copy the cached .npy embeddings back here.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cfm_eval"]
